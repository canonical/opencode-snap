name: opencode
base: core24
version: 1.14.41
title: OpenCode
summary: Open source AI coding agent for the terminal
description: |
  OpenCode is an open source AI coding agent for terminal workflows.
  This snap packages the upstream prebuilt binaries from the opencode-ai GitHub releases.
license: Apache-2.0
contact: https://github.com/anomalyco/opencode/issues
website: https://opencode.ai
source-code: https://github.com/anomalyco/opencode
issues: https://github.com/anomalyco/opencode/issues

grade: stable
confinement: classic

apps:
  opencode:
    command: bin/opencode
    completer: usr/share/bash-completion/completions/opencode.opencode

parts:
  opencode:
    plugin: dump
    source:
      - on amd64 to amd64: https://github.com/anomalyco/opencode/releases/download/v1.14.41/opencode-linux-x64-baseline.tar.gz
      - on arm64 to arm64: https://github.com/anomalyco/opencode/releases/download/v1.14.41/opencode-linux-arm64.tar.gz
    source-type: tar
    organize:
      opencode: bin/opencode

  completion:
    plugin: nil
    source: snap/local
    override-build: |
      install -Dm644 "$CRAFT_PART_SRC/opencode.opencode" "$CRAFT_PART_INSTALL/usr/share/bash-completion/completions/opencode.opencode"
