name: Build

on:
  push:
    branches: [ main, master, develop, '2.x*' ]
    tags: [ 'v*' ]
    paths:
      - 'snap/snapcraft.yaml'
      - '.image-garden.mk'
      - 'spread.yaml'
      - 'tests/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master, develop, '2.x*' ]
    paths:
      - 'snap/snapcraft.yaml'
      - '.image-garden.mk'
      - 'spread.yaml'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      skip-spread-tests:
        type: boolean
        description: "Skip integration tests (spread) and publish directly. Requires manual approval gate."
        default: false
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  snap-build-test-publish:
    uses: ./.github/workflows/tasteful-crafts.yml
    # Branch builds publish to vars.SNAPCRAFT_CHANNEL when set, otherwise to
    # latest/edge. Tag builds publish to latest/candidate. The 2.x branch and
    # its tags route to the 2/ track instead. Create matching GitHub environments
    # and add an environment secret named SNAPCRAFT_STORE_CREDENTIALS to each one.
    with:
      snapstore-channel: >-
        ${{ startsWith(github.ref, 'refs/heads/2.x')
          && (github.ref_type == 'tag' && '2/candidate' || '2/edge')
          || (github.ref_type == 'tag' && 'latest/candidate'
            || vars.SNAPCRAFT_CHANNEL || 'latest/edge') }}
      skip-spread-tests: ${{ inputs.skip-spread-tests || false }}
    secrets:
      publish-credentials: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
