name: snapcraft upload

on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        description: "Artifact name to download and publish"
        required: false
        default: ""
      artifact-pattern:
        type: string
        description: "Artifact name pattern to download and publish"
        required: false
        default: ""
      enable-pkgproxy:
        type: boolean
        description: "Whether to route snap store downloads through a pkgproxy caching proxy during installation"
        required: false
        default: true
      snapcraft-channel:
        type: string
        description: "Snap store channel for Snapcraft snap (e.g., latest/stable,
          latest/edge)"
        required: false
        default: latest/stable
      snapstore-channel:
        type: string
        description: "Snap store channel to publish to (e.g., latest/edge)"
        required: true
      github-environment:
        type: string
        description: "Deployment environment (used for approval gates)"
        required: true
      github-deployment:
        type: boolean
        description: "Whether this upload should be marked as a deployment (used for approval gates)"
        required: false
        default: false
    secrets:
      publish-credentials:
        description: "GitHub secret containing Snap Store credentials for publishing"
        required: true

jobs:
  upload:
    name: upload
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.github-environment }}
      deployment: ${{ inputs.github-deployment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up pkgproxy caching proxy
        if: ${{ fromJSON(inputs.enable-pkgproxy) }}
        id: pkgproxy
        uses: zyga/setup-pkgproxy@v1

      - name: Install snapcraft snap
        shell: bash
        run: |
          sudo snap install snapcraft --channel "${{ inputs.snapcraft-channel }}" --classic

      - name: Download snap artifact
        if: ${{ inputs.artifact-pattern == '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: ./snaps/

      - name: Download snap artifacts
        if: ${{ inputs.artifact-pattern != '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: ./snaps/
          merge-multiple: false

      - name: Release to ${{ inputs.snapstore-channel }}
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.publish-credentials }}
          SNAP_CHANNEL: ${{ inputs.snapstore-channel }}
        run: |
          set -x
          shopt -s nullglob globstar

          for SNAP_FILE in ./snaps/**/*.snap; do
            [ -f "$SNAP_FILE" ] || continue
            
            echo "Publishing $SNAP_FILE to $SNAP_CHANNEL"
            
            SNAP_NAME="$(basename "$SNAP_FILE")"
            SNAP_NAME="${SNAP_NAME%.snap}"
            SNAP_NAME="${SNAP_NAME%%_*}"
            SNAP_DIR="$(dirname "$SNAP_FILE")"
            
            COMPONENT_ARGS=()
            for comp in "$SNAP_DIR"/"$SNAP_NAME"+*.comp; do
              [ -f "$comp" ] || continue
              comp_file="$(basename "$comp")"
              comp_stem="${comp_file%.comp}"
              comp_tail="${comp_stem#*+}"
              comp_name="${comp_tail%%_*}"
              
              if [ "$comp_tail" = "$comp_stem" ] || [ -z "$comp_name" ]; then
                echo "::warning::Could not infer component name from $comp_file, skipping"
                continue
              fi
              
              echo "Adding component: $comp_name from $comp_file"
              COMPONENT_ARGS+=(--component "$comp_name=$comp")
            done
            
            if [ ${#COMPONENT_ARGS[@]} -gt 0 ]; then
              echo "Publishing with components: ${COMPONENT_ARGS[@]}"
              snapcraft upload --verbosity=brief "$SNAP_FILE" "${COMPONENT_ARGS[@]}" --release "$SNAP_CHANNEL"
            else
              echo "Publishing without components"
              snapcraft upload --verbosity=brief "$SNAP_FILE" --release "$SNAP_CHANNEL"
            fi
          done

      - name: Prepare pkgproxy package cache for GitHub cache save
        if: ${{ fromJSON(inputs.enable-pkgproxy) && always() }}
        shell: bash
        run: |
          sudo systemctl stop pkgproxy.service || true
          sudo chown -R "$USER:$USER" /var/cache/pkgproxy

      # Save only when the stable success key wasn't an exact hit (GitHub caches
      # are immutable; a warm cache needs no rewrite).
      - name: Save pkgproxy package cache
        if: ${{ fromJSON(inputs.enable-pkgproxy) && steps.pkgproxy.outputs.package-cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /var/cache/pkgproxy
          key: ${{ steps.pkgproxy.outputs.package-cache-key-success }}
