name: snapcraft pack

on:
  workflow_call:
    inputs:
      job-arch:
        type: string
        description: Architecture label used in the GitHub job name
        required: true
      lxd-channel:
        type: string
        description: "Snap store channel for LXD snap (e.g., latest/stable, latest/edge)"
        required: false
        default: latest/stable
      snapcraft-channel:
        type: string
        description: "Snap store channel for Snapcraft snap (e.g., latest/stable,
          latest/edge)"
        required: false
        default: latest/stable
      enable-pkgproxy:
        type: boolean
        description: "Whether to install and use pkgproxy as a caching proxy for apt,
          snap, Go module and LXD image downloads during the build"
        required: false
        default: true
      runs-on:
        type: string
        description: "The type of machine to run on (e.g., ubuntu-24.04)"
        required: false
        default: ubuntu-24.04
    outputs:
      snap-filename:
        description: "Filename of the generated snap file"
        value: ${{ jobs.pack.outputs.snap-filename }}
      arch:
        description: "Architecture the snap was built for"
        value: ${{ jobs.pack.outputs.arch }}
      comp-filenames:
        description: "Comma-separated list of component filenames"
        value: ${{ jobs.pack.outputs.comp-filenames }}

jobs:
  pack:
    name: pack (${{ inputs.job-arch }})
    runs-on: ${{ inputs.runs-on }}
    outputs:
      snap-filename: ${{ steps.snap-output.outputs.snap-filename }}
      comp-filenames: ${{ steps.comp-output.outputs.comp-filenames }}
      arch: ${{ steps.arch.outputs.ARCH }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Check host architecture
        id: arch
        run: echo "ARCH=$(uname -m)" >> $GITHUB_OUTPUT

      - name: Restore pkgproxy binary cache
        if: ${{ fromJSON(inputs.enable-pkgproxy) }}
        id: pkgproxy-binary-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/pkgproxy-bin
          key: pkgproxy-bin-v5-${{ runner.os }}-${{ inputs.job-arch }}

      - name: Set up Go for pkgproxy
        if: ${{ fromJSON(inputs.enable-pkgproxy) && steps.pkgproxy-binary-cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.5

      - name: Build pkgproxy from source
        if: ${{ fromJSON(inputs.enable-pkgproxy) }}
        shell: bash
        run: |
          mkdir -p .cache/pkgproxy-bin
          if [ ! -x .cache/pkgproxy-bin/pkgproxy ]; then
            GOBIN="$PWD/.cache/pkgproxy-bin" go install gitlab.com/zygoon/pkgproxy/cmd/pkgproxy@v0.0.0-20260901193356-848d1c0f4249
            ln -sf pkgproxy .cache/pkgproxy-bin/pkgproxyctl
            ln -sf pkgproxy .cache/pkgproxy-bin/pkgproxy.pkgproxyctl
          fi
          echo "$PWD/.cache/pkgproxy-bin" >> "$GITHUB_PATH"

      - name: Save pkgproxy binary cache
        if: ${{ fromJSON(inputs.enable-pkgproxy) && steps.pkgproxy-binary-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .cache/pkgproxy-bin
          key: pkgproxy-bin-v5-${{ runner.os }}-${{ inputs.job-arch }}

      - name: Prepare pkgproxy package cache directories for restore
        if: ${{ fromJSON(inputs.enable-pkgproxy) }}
        shell: bash
        run: |
          sudo mkdir -p /run/pkgproxy /var/cache/pkgproxy
          sudo chown "$USER:$USER" /run/pkgproxy
          sudo chown -R "$USER:$USER" /var/cache/pkgproxy

      - name: Restore pkgproxy package cache
        if: ${{ fromJSON(inputs.enable-pkgproxy) }}
        uses: actions/cache/restore@v6
        with:
          path: /var/cache/pkgproxy
          key: pkgproxy-cache-v1-${{ runner.os }}-${{ inputs.job-arch }}-success-${{ github.run_id }}
          restore-keys: |
            pkgproxy-cache-v1-${{ runner.os }}-${{ inputs.job-arch }}-success-
            pkgproxy-cache-v1-${{ runner.os }}-${{ inputs.job-arch }}-partial-

      - name: Hand restored pkgproxy package cache back to pkgproxy
        if: ${{ fromJSON(inputs.enable-pkgproxy) }}
        shell: bash
        run: |
          sudo chown -R root:root /var/cache/pkgproxy

      - name: Start pkgproxy daemon on host
        if: ${{ fromJSON(inputs.enable-pkgproxy) }}
        shell: bash
        run: |
          sudo systemd-run \
            --unit=pkgproxy \
            --property=Restart=no \
            --property=WorkingDirectory="$PWD" \
            "$PWD/.cache/pkgproxy-bin/pkgproxy" \
              -addr :3142 \
              -cache-dir /var/cache/pkgproxy \
              -stats-socket-path /run/pkgproxy/stats.sock \
              -admin-socket-path /run/pkgproxy/admin.sock
          for _ in {1..100}; do
            if [ -S /run/pkgproxy/stats.sock ] && [ -S /run/pkgproxy/admin.sock ]; then
              exit 0
            fi
            sleep 0.1
          done
          sudo systemctl status pkgproxy.service --no-pager || true
          sudo journalctl -u pkgproxy.service --no-pager -n 100 || true
          exit 1

      - name: Configure pkgproxy as apt cache proxy on host
        if: ${{ fromJSON(inputs.enable-pkgproxy) }}
        shell: bash
        run: |
          pkgproxyctl setup apt -addr :3142 | sudo sh

      - name: Configure pkgproxy as snap cache proxy on host
        if: ${{ fromJSON(inputs.enable-pkgproxy) }}
        shell: bash
        run: |
          pkgproxyctl setup snap -addr :3142 | sudo sh

      - name: Install lxd snap
        shell: bash
        run: |
          sudo snap install lxd --channel "${{ inputs.lxd-channel }}"

      - name: Configure LXD and networking
        shell: bash
        run: |
          sudo lxd init --auto
          sudo iptables -P FORWARD ACCEPT
          sudo chmod 666 /var/snap/lxd/common/lxd/unix.socket

      - name: Install snapcraft snap
        shell: bash
        run: |
          sudo snap install snapcraft --channel "${{ inputs.snapcraft-channel }}" --classic

      - name: Configure pkgproxy as cache proxy inside snapcraft build containers
        if: ${{ fromJSON(inputs.enable-pkgproxy) }}
        shell: bash
        run: |
          # Pre-create the 'snapcraft' LXD project that craft-providers uses lazily;
          # pkgproxy's setup snapcraft needs it to exist before snapcraft pack runs.
          lxc project create snapcraft || true
          lxc profile device add default root disk path=/ pool=default --project snapcraft || true
          lxc profile device add default eth0 nic network=lxdbr0 name=eth0 --project snapcraft || true

          # Injects the apt/snapd/go proxy config and the raw.lxc pre-start hook into the
          # 'snapcraft' project's default profile. This must succeed: the hook is a hard
          # LXC forkstart dependency, so a silently-failed provision here surfaces minutes
          # later as the opaque "lxd forkstart ... exit status 1" during snapcraft pack.
          pkgproxyctl setup snapcraft -addr :3142 | sudo sh

      - name: Verify pkgproxy provisioned the LXC pre-start hook
        if: ${{ fromJSON(inputs.enable-pkgproxy) }}
        shell: bash
        run: |
          # The hook file the 'snapcraft' profile's raw.lxc points at must exist, be
          # executable, and be visible to the LXD daemon before snapcraft launches any
          # build container — or forkstart fails deep inside the build with the opaque
          # "lxd forkstart ... exit status 1". Read the path straight from the profile
          # (don't hardcode it) so this checks exactly what LXC will exec.
          HOOK_PATH=$(lxc profile get default raw.lxc --project snapcraft | sed -n 's/^lxc.hook.pre-start = //p')
          echo "profile raw.lxc hook path: ${HOOK_PATH:-<unset>}"
          if [ -z "$HOOK_PATH" ] || ! sudo test -x "$HOOK_PATH"; then
            echo "::error::pkgproxy pre-start hook not provisioned/executable at '${HOOK_PATH}'" >&2
            echo "--- pkgproxy profile (project snapcraft) ---"
            lxc profile show default --project snapcraft || true
            echo "--- pkgproxy daemon journal ---"
            sudo journalctl -u pkgproxy.service --no-pager -n 100 || true
            echo "--- provisioning dirs ---"
            sudo ls -laR /var/snap/pkgproxy/common/lxd /var/lib/pkgproxy 2>/dev/null || true
            exit 1
          fi
          echo "pre-start hook present and executable:"
          sudo ls -l "$HOOK_PATH"

      - name: Configure pkgproxy as cached LXD image remote
        if: ${{ fromJSON(inputs.enable-pkgproxy) }}
        shell: bash
        run: |
          # Must run as the lxc/snapcraft user; it writes the user's LXC remote
          # config and pins pkgproxy's self-signed LXD proxy certificate. Run it
          # after lxc has initialized the snap LXD client config directory.
          lxc remote list >/dev/null
          pkgproxyctl setup lxd-remote -addr :3142 | sh

      - name: Build snap
        shell: bash
        run: |
          echo "::group::pkgproxy statistics before build"
          if command -v pkgproxyctl >/dev/null 2>&1; then
            du -sh /var/cache/pkgproxy || true
            du -sh /var/cache/pkgproxy/*/objects 2>/dev/null || true
            pkgproxyctl stats show || true
          else
            echo "pkgproxy not installed, skipping cache stats"
          fi
          echo "::endgroup::"

          snapcraft pack -v

      - name: Show pkgproxy statistics after build
        if: ${{ fromJSON(inputs.enable-pkgproxy) }}
        shell: bash
        run: |
          echo "::group::pkgproxy cache statistics (post-build)"
          du -sh /var/cache/pkgproxy || true
          du -sh /var/cache/pkgproxy/*/objects 2>/dev/null || true
          pkgproxyctl stats show || true
          echo "::endgroup::"

      - name: Capture snap output
        id: snap-output
        shell: bash
        run: |
          SNAP_FILE=$(ls -1 *.snap 2>/dev/null | head -1)
          if [ -z "$SNAP_FILE" ]; then
            echo "ERROR: No snap file generated"
            exit 1
          fi
          echo "snap-filename=${SNAP_FILE}" >> $GITHUB_OUTPUT
          echo "Snap file: ${SNAP_FILE}"

      - name: Capture component outputs
        id: comp-output
        shell: bash
        run: |
          shopt -s nullglob
          files=(*.comp)
          if [ ${#files[@]} -gt 0 ]; then
            COMP_FILES=$(IFS=,; echo "${files[*]}")
          else
            COMP_FILES=""
          fi
          echo "comp-filenames=${COMP_FILES}" >> $GITHUB_OUTPUT
          if [ -n "${COMP_FILES}" ]; then
            echo "Component files: ${COMP_FILES}"
          else
            echo "No component files generated"
          fi

      - name: Organize artifacts into per-architecture directory
        id: arch-dir
        shell: bash
        run: |
          SNAP_FILE=$(ls -1 *.snap 2>/dev/null | head -1)
          if [ -z "$SNAP_FILE" ]; then
            echo "ERROR: No snap file generated"
            exit 1
          fi
          # Determine target arch from the snap filename
          case "$SNAP_FILE" in
            *amd64*) ARCH=amd64 ;;
            *arm64*) ARCH=arm64 ;;
            *)
              echo "::warning::Could not determine arch from snap filename, defaulting to arch"
              ARCH=arch
              ;;
          esac
          echo "Architecture: $ARCH (from $SNAP_FILE)"
          # Create architecture-specific directory and move artifacts into it
          mkdir -p "$ARCH"
          mv *.snap "$ARCH/" 2>/dev/null || true
          mv *.comp "$ARCH/" 2>/dev/null || true
          echo "arch-dir=$ARCH" >> $GITHUB_OUTPUT
          echo "Moved artifacts to $ARCH/"
          ls -la "$ARCH/"

      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: snap-${{ steps.arch.outputs.ARCH }}
          path: |
            ${{ steps.arch-dir.outputs.arch-dir }}/*.snap
            ${{ steps.arch-dir.outputs.arch-dir }}/*.comp
          retention-days: 7

      - name: Capture pkgproxy and LXC diagnostics on failure
        if: ${{ fromJSON(inputs.enable-pkgproxy) && failure() }}
        shell: bash
        run: |
          # Surface the daemon's own log (notably its "lxd-provision files written" /
          # "... failed" lines) so a provisioning failure is diagnosable from the
          # uploaded artifacts, alongside the snapcraft logs.
          mkdir -p ~/.local/state/snapcraft/log
          sudo journalctl -u pkgproxy.service --no-pager > ~/.local/state/snapcraft/log/pkgproxy-daemon.log 2>&1 || true

          # forkstart's bare "exit status 1" hides the real reason a container failed
          # to start; that lives in the container's own lxc log. Capture the failing
          # base instance's log and the LXD daemon log so the actual forkstart error
          # (hook stderr, cgroup, apparmor, mount, ...) is visible.
          for inst in $(lxc list --project snapcraft --format csv -c n 2>/dev/null | grep base-instance || true); do
            echo "=== lxc info --show-log $inst ===" >> ~/.local/state/snapcraft/log/lxc-container.log
            lxc info --show-log --project snapcraft "$inst" >> ~/.local/state/snapcraft/log/lxc-container.log 2>&1 || true
          done
          sudo cat /var/snap/lxd/common/lxd/logs/*/lxc.log >> ~/.local/state/snapcraft/log/lxc-container.log 2>/dev/null || true
          sudo journalctl -u snap.lxd.daemon --no-pager -n 200 >> ~/.local/state/snapcraft/log/lxc-container.log 2>&1 || true

      - name: Upload snapcraft logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapcraft-logs-${{ steps.arch.outputs.ARCH }}
          path: |
            ~/.local/state/snapcraft/log/snapcraft-*.log
            ~/.local/state/snapcraft/log/pkgproxy-daemon.log
            ~/.local/state/snapcraft/log/lxc-container.log
          retention-days: 7

      - name: Prepare pkgproxy package cache for GitHub cache save
        if: ${{ fromJSON(inputs.enable-pkgproxy) && always() }}
        shell: bash
        run: |
          sudo systemctl stop pkgproxy.service || true
          sudo chown -R "$USER:$USER" /var/cache/pkgproxy

      - name: Save pkgproxy package cache (on success)
        if: ${{ fromJSON(inputs.enable-pkgproxy) && success() && steps.snap-output.outputs.snap-filename != '' }}
        uses: actions/cache/save@v6
        with:
          path: /var/cache/pkgproxy
          key: pkgproxy-cache-v1-${{ runner.os }}-${{ inputs.job-arch }}-success-${{ github.run_id }}

      - name: Save pkgproxy package cache (on failure)
        if: ${{ fromJSON(inputs.enable-pkgproxy) && failure() }}
        uses: actions/cache/save@v6
        with:
          path: /var/cache/pkgproxy
          key: pkgproxy-cache-v1-${{ runner.os }}-${{ inputs.job-arch }}-partial-${{ github.run_id }}
