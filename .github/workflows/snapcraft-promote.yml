name: snapcraft promote

on:
  workflow_dispatch:
    inputs:
      source-channel:
        description: Snap Store channel to promote revisions from
        required: true
        default: latest/candidate
        type: string
      target-channel:
        description: Snap Store channel to promote revisions into
        required: true
        default: latest/stable
        type: string

jobs:
  promote:
    name: promote from ${{ inputs.source-channel }} to ${{ inputs.target-channel }}
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.target-channel }}
      deployment: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up pkgproxy caching proxy
        id: pkgproxy
        uses: zyga/setup-pkgproxy@v1

      - name: Install snapcraft snap
        shell: bash
        run: |
          sudo snap install snapcraft --channel latest/stable --classic

      - name: Resolve snap name from snapcraft.yaml
        id: snap-name
        shell: bash
        run: |
          set -euo pipefail
          SNAP_NAME="$(sed -nE 's/^name:[[:space:]]*([^[:space:]#]+).*$/\1/p' $(find . -name snapcraft.yaml) | head -n1)"
          if [ -z "$SNAP_NAME" ]; then
            echo "::error::Could not determine snap name from snapcraft.yaml"
            exit 1
          fi
          echo "snap-name=$SNAP_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved snap name: $SNAP_NAME"

      - name: Promote ${{ inputs.source-channel }} into ${{ inputs.target-channel }}
        env:
          # Create a GitHub environment whose name matches the target channel
          # (for example latest/stable) and add SNAPCRAFT_STORE_CREDENTIALS
          # there. Export the secret value locally with:
          # snapcraft export-login --snaps=<snap-name> --channels=<target-channel> \
          #   --acls=package_access,package_release <token-name>
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SNAP_NAME: ${{ steps.snap-name.outputs.snap-name }}
        shell: bash
        run: |
          set -euo pipefail
          snapcraft promote \
            --from-channel="${{ inputs.source-channel }}" \
            --to-channel="${{ inputs.target-channel }}" \
            --yes \
            "$SNAP_NAME"

      - name: Prepare pkgproxy package cache for GitHub cache save
        if: ${{ always() }}
        shell: bash
        run: |
          sudo systemctl stop pkgproxy.service || true
          sudo chown -R "$USER:$USER" /var/cache/pkgproxy

      # Save only when the stable success key wasn't an exact hit (GitHub caches
      # are immutable; a warm cache needs no rewrite).
      - name: Save pkgproxy package cache
        if: ${{ steps.pkgproxy.outputs.package-cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /var/cache/pkgproxy
          key: ${{ steps.pkgproxy.outputs.package-cache-key-success }}
