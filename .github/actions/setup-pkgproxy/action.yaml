name: Setup pkgproxy
description: >-
  Build/install pkgproxy and run it as a caching proxy for apt, snap store, Go
  module, and LXD image traffic on this runner. Restores a persistent payload
  cache and starts the daemon; the caller is responsible for pointing its tools
  at the proxy (pkgproxyctl setup ...) and for saving the payload cache at the
  end of the job.
inputs:
  version:
    description: >-
      pkgproxy version to build: a Go module version string for
      gitlab.com/zygoon/pkgproxy/cmd/pkgproxy (e.g. a pseudo-version pinning an
      exact commit). Pinned, not @main, so proxy.golang.org can't serve a stale
      main snapshot.
    required: true
  go-version:
    description: Go toolchain version used to build pkgproxy when the binary cache misses.
    required: false
    default: "1.27.1"
  addr:
    description: Address pkgproxy listens on for apt/snap/go and the LXD cert download.
    required: false
    default: ":3142"
  binary-cache-key:
    description: >-
      actions/cache key prefix for the built pkgproxy binary. The pinned version
      and CPU arch are appended automatically (amd64/arm64 share the Linux OS
      label, and GitHub only isolates caches by OS, not arch, by default), so
      bumping version alone busts the cache — no manual key edit needed.
    required: false
    default: pkgproxy-bin
  package-cache-key:
    description: >-
      actions/cache key prefix for the pkgproxy payload cache
      (/var/cache/pkgproxy). Uses stable per-arch keys (no per-run id): the
      restore uses <prefix>-<arch>-success with -success-/-partial- prefix
      restore-keys, and the caller saves under the same key only when it wasn't
      an exact hit (overwrite-resistant — GitHub caches are immutable, so a
      per-run key would just write a fresh cache every run and churn storage).
    required: false
    default: pkgproxy-cache-v2
  configure-host:
    description: >-
      Whether to point the host's apt and snapd at the proxy (pkgproxyctl setup
      apt/snap). Set false when only the LXD container/image caching is wanted.
    required: false
    default: "true"
outputs:
  addr:
    description: >-
      The address pkgproxy is listening on (the resolved addr input). Pass this to
      any later `pkgproxyctl setup ... -addr` call so the address lives in one
      place (this action's input default), not repeated as a literal.
    value: ${{ inputs.addr }}
  cache-dir:
    description: The pkgproxy payload cache directory (save this at job end).
    value: /var/cache/pkgproxy
  package-cache-hit:
    description: >-
      'true' when the stable success key restored exactly. When true, the caller
      should skip its save (the cache already holds this content); when false,
      save under package-cache-key-success (or -partial on failure).
    value: ${{ steps.package-cache.outputs.cache-hit }}
  package-cache-key-success:
    description: The stable per-arch package-cache key (use for the save-on-success step).
    value: ${{ steps.keys.outputs.package-cache-key-success }}
  package-cache-key-partial:
    description: The stable per-arch package-cache key to save under when the job fails.
    value: ${{ steps.keys.outputs.package-cache-key-partial }}
runs:
  using: composite
  steps:
    - name: Compute cache keys
      id: keys
      shell: bash
      run: |
        # Arch is in the key (amd64/arm64 both report runner.os=Linux; GitHub's
        # default isolation is by OS only, not arch), but runner.os and a per-run
        # id are deliberately omitted: the former is redundant, the latter would
        # make an immutable cache that's never reused in place.
        echo "binary-key=${{ inputs.binary-cache-key }}-${{ inputs.version }}-go${{ inputs.go-version }}-${{ runner.arch }}" >> "$GITHUB_OUTPUT"
        echo "package-cache-key-success=${{ inputs.package-cache-key }}-${{ runner.arch }}-success" >> "$GITHUB_OUTPUT"
        echo "package-cache-key-partial=${{ inputs.package-cache-key }}-${{ runner.arch }}-partial" >> "$GITHUB_OUTPUT"

    - name: Restore pkgproxy binary cache
      id: binary-cache
      uses: actions/cache/restore@v6
      with:
        path: .cache/pkgproxy-bin
        key: ${{ steps.keys.outputs.binary-key }}

    - name: Set up Go for pkgproxy
      if: ${{ steps.binary-cache.outputs.cache-hit != 'true' }}
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}

    - name: Build pkgproxy binary
      shell: bash
      env:
        PKGPROXY_VERSION: ${{ inputs.version }}
      run: |
        ${{ github.action_path }}/build.sh

    - name: Save pkgproxy binary cache
      if: ${{ steps.binary-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: .cache/pkgproxy-bin
        key: ${{ steps.keys.outputs.binary-key }}

    - name: Prepare pkgproxy package cache directory for restore
      shell: bash
      run: |
        # actions/cache/restore runs as the runner user, so the cache dir must be
        # writable by it now. Once the daemon's unit starts, CacheDirectory= (see
        # start.sh) recursively chowns it to root, so no manual chown is needed
        # here beyond making it restorable. /run/pkgproxy needs no pre-creation:
        # the unit's RuntimeDirectory= creates it (and removes it on stop).
        sudo mkdir -p /var/cache/pkgproxy
        sudo chown -R "$USER:$USER" /var/cache/pkgproxy

    - name: Restore pkgproxy package cache
      id: package-cache
      uses: actions/cache/restore@v6
      with:
        path: /var/cache/pkgproxy
        key: ${{ steps.keys.outputs.package-cache-key-success }}
        restore-keys: |
          ${{ inputs.package-cache-key }}-${{ runner.arch }}-success
          ${{ inputs.package-cache-key }}-${{ runner.arch }}-partial

    - name: Start pkgproxy daemon and configure host
      shell: bash
      env:
        PKGPROXY_ADDR: ${{ inputs.addr }}
        CONFIGURE_HOST: ${{ inputs.configure-host }}
      run: |
        ${{ github.action_path }}/start.sh
