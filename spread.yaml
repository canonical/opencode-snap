project: opencode-snap

backends:
    garden:
        type: adhoc
        allocate: |
            if [ -n "${SPREAD_HOST_PATH-}" ]; then
                PATH="${SPREAD_HOST_PATH}"
            fi
            exec image-garden allocate --spread \
               "$SPREAD_SYSTEM"."${SPREAD_ARCH:=$(uname -m)}"
        discard: |
            if [ -n "${SPREAD_HOST_PATH-}" ]; then
                PATH="${SPREAD_HOST_PATH}"
            fi
            image-garden discard "$SPREAD_SYSTEM_ADDRESS"
        systems:
            - ubuntu-cloud-24.04:
                  username: root
                  password: root
            - ubuntu-cloud-26.04:
                  username: root
                  password: root
            - debian-cloud-13:
                  username: root
                  password: root
            - fedora-cloud-43:
                  username: root
                  password: root

exclude:
    - ".git/*"

path: /root/opencode-snap

prepare: |
    # Spread's file delivery preserves the uid from the git checkout, which
    # is typically not root. Make the whole project tree root-owned so that
    # strictly-confined snaps (e.g. mannequin, via its auto-connected home
    # interface) can read it through AppArmor's owner match.
    chown -R root:root /root/opencode-snap

    # Install the snap that was copied into the test environment.
    snap install "$(ls ./opencode_*.snap | sort -r | head -n 1)" --dangerous --classic

    # Install the desktop component built alongside the snap (v1 tracks only;
    # v2 is CLI-only and has no component).
    if comp_file=$(ls ./opencode+desktop*.comp 2>/dev/null); then
      snap install "$comp_file" --dangerous
    fi

debug-each: |
    echo "Kernel and architecture:"
    uname -a

    echo "OS release info:"
    cat /etc/os-release

    echo "Installed snaps:"
    snap list

suites:
    tests/smoke/:
        summary: Smoke tests for the opencode snap
