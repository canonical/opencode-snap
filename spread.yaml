project: opencode-snap

backends:
    garden:
        type: adhoc
        allocate: |
            if [ -n "${SPREAD_HOST_PATH-}" ]; then
                PATH="${SPREAD_HOST_PATH}"
            fi
            exec image-garden allocate --spread \
               "$SPREAD_SYSTEM"."${SPREAD_ARCH:=$(uname -m)}"
        discard: |
            if [ -n "${SPREAD_HOST_PATH-}" ]; then
                PATH="${SPREAD_HOST_PATH}"
            fi
            image-garden discard "$SPREAD_SYSTEM_ADDRESS"
        systems:
            - ubuntu-cloud-24.04:
                  username: ubuntu
                  password: ubuntu
            - ubuntu-cloud-26.04:
                  username: ubuntu
                  password: ubuntu
            - debian-cloud-13:
                  username: debian
                  password: debian
            - fedora-cloud-43:
                  username: fedora
                  password: fedora

exclude:
    - ".git/*"

path: /root/opencode-snap

prepare: |
    # Install the snap that was copied into the test environment.
    SNAP_ARCH=$(uname -m)
    case "$SNAP_ARCH" in
        x86_64) SNAP_ARCH=amd64 ;;
        aarch64) SNAP_ARCH=arm64 ;;
    esac
    SNAP_FILE="$(ls -1 ./"${SNAP_ARCH}"/opencode_*.snap 2>/dev/null | sort -r | head -n 1)"
    if [ -z "$SNAP_FILE" ]; then
        echo "ERROR: No snap file found for architecture $SNAP_ARCH" >&2
        exit 1
    fi
    echo "Installing: $SNAP_FILE"
    snap install "$SNAP_FILE" --dangerous --classic

debug-each: |
    echo "Kernel and architecture:"
    uname -a

    echo "OS release info:"
    cat /etc/os-release

    echo "Installed snaps:"
    snap list

suites:
    tests/smoke/:
        summary: Smoke tests for the opencode snap
